# Free tier: one Docker web service (gunicorn + Celery worker/beat in one container)
# and a free Key Value instance as the Celery broker. No Postgres here: the demo uses
# embedded SQLite. Set DATABASE_URL=postgres://... to run on Postgres, the target.
services:
  - type: web
    name: callback-ledger
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: CELERY_BROKER_URL
        fromService: {type: keyvalue, name: callback-ledger-kv, property: connectionString}
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: CALLBACK_LINK_SECRET
        generateValue: true
      - key: PARTNER_SIGNING_SECRET
        generateValue: true
  - type: keyvalue
    name: callback-ledger-kv
    plan: free
    region: oregon
    ipAllowList: []
